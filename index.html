<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LEORÉ - structural silhouettes and architectural minimalism for the urban landscape." />
    <title>LEORÉ | Premium Streetwear</title>
    <script>
      // LOCAL PREVIEW ONLY — remove before merge. Invalid/missing values leave the approved branch default intact.
      (() => {
        const allowed = ["sora-manrope", "manrope", "inter-manrope"];
        const selected = new URLSearchParams(window.location.search).get("type-preview");
        if (allowed.includes(selected)) document.documentElement.dataset.typePreview = selected;
      })();
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              tertiary: "#e9c349", background: "#131313", surface: "#131313",
              "surface-container-lowest": "#0e0e0e", "surface-container-low": "#1b1c1c",
              "on-background": "#e4e2e1", "on-surface": "#e4e2e1",
              "on-surface-variant": "#c4c7c7", outline: "#8e9192", "outline-variant": "#444748"
            },
            borderRadius: { DEFAULT: "0rem", lg: "0rem", xl: "0rem", full: "9999px" },
            spacing: { "margin-desktop": "64px", "margin-mobile": "20px", "section-gap": "120px", "container-max": "1440px" },
            fontFamily: { button: ["Manrope"], body: ["Manrope"], headline: ["Bodoni Moda"], label: ["JetBrains Mono"] },
            fontSize: {
              button: ["14px", { lineHeight: "20px", letterSpacing: "0.05em", fontWeight: "600" }],
              "body-md": ["16px", { lineHeight: "24px" }], "body-lg": ["18px", { lineHeight: "28px" }],
              "headline-md": ["24px", { lineHeight: "32px" }], "headline-lg": ["32px", { lineHeight: "40px" }],
              "display-lg": ["72px", { lineHeight: "76px" }], "display-lg-mobile": ["44px", { lineHeight: "48px" }],
              "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.15em" }]
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="font-body text-body-md overflow-x-hidden bg-background text-on-background">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
